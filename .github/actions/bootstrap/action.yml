name: Bootstrap
description: Node 22 + pnpm 9 + store cache + frozen-lockfile install. Run after actions/checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: '9'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
