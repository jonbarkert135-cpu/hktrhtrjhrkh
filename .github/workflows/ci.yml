name: CI
on:
  pull_request:
  push: { branches: [main] }

# Every job carries `timeout-minutes: 25`: a hung external step (e.g. an apt mirror
# stalling inside `playwright install --with-deps`) otherwise burns the full 6 h GitHub
# default before the run is marked failed. 25 min is ~5x the slowest observed job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm lint
      - run: pnpm depcruise
      - run: node scripts/check-no-todo.mjs
      - run: node scripts/check-skips.mjs
      - run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # P1 suite is small enough to run unsharded; shard ×4 (19_DEPLOYMENT.md §5) when it
    # exceeds the 180 s budget — that also requires scripts/merge-coverage.mjs.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nexus_test, POSTGRES_USER: nexus }
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://nexus:test@localhost:5432/nexus_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm db:migrate
      - run: pnpm turbo run test -- --coverage
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: '**/coverage/coverage-summary.json', retention-days: 7 }

  coverage-gate:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # diff-coverage needs the merge base
      - uses: ./.github/actions/bootstrap
      - uses: actions/download-artifact@v4
        with: { name: coverage, path: . }
      - run: node scripts/check-coverage.mjs
      - run: node scripts/diff-coverage.mjs --base=${{ github.event.pull_request.base.sha || github.event.before }}

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm build
      - run: node scripts/check-bundle-secrets.mjs
      - run: node scripts/check-bundle-budget.mjs
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: 'apps/*/dist', retention-days: 7 }

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.49.1-jammy
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nexus_test, POSTGRES_USER: nexus }
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://nexus:test@postgres:5432/nexus_test
      REDIS_URL: redis://redis:6379
      NEXUS_INTEGRATIONS_MODE: stub
      NEXUS_TEST_ENDPOINTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm db:migrate && pnpm db:seed
      # Playwright's webServer starts `pnpm dev` (api on :3001, web on :5173) and e2e/global.setup.ts
      # waits for /readyz before the first spec runs.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report }

  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.49.1-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      # RECORD-ONLY in P1: the only rendered surface is the placeholder shell, so there is
      # nothing stable to diff yet. P2 (canvas engine) commits the baselines and turns this
      # into a gate by dropping `--update-snapshots` and removing `continue-on-error`.
      - run: pnpm e2e --update-snapshots --grep @visual
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          { name: visual-snapshots, path: e2e/visual, retention-days: 7, if-no-files-found: ignore }

  bench:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - uses: actions/download-artifact@v4
        with: { name: dist, path: apps }
      - run: pnpm exec playwright install --with-deps chromium
      # bench/canvas.bench.ts drives a real browser against the production build; nothing else in
      # this job starts a server, so the preview server is started here and awaited explicitly.
      - name: Serve the production web build on :5173
        run: |
          nohup pnpm --filter @nexus/web exec vite preview --port 5173 --strictPort --host 127.0.0.1 \
            > /tmp/bench-web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:5173/; then echo 'web preview is up'; exit 0; fi
            sleep 2
          done
          echo 'web preview did not start within 120s:'; cat /tmp/bench-web.log; exit 1
      - run: pnpm bench
      - name: Web preview log
        if: failure()
        run: cat /tmp/bench-web.log || true
      # P2: the engine metrics are real, so the absolute N1 budgets are enforced. The 5 % delta gate
      # only bites once bench/baseline.json holds numbers recorded on a CI runner — comparing a CI
      # run against a developer laptop would fail for hardware reasons, not for regressions.
      - run: node bench/compare.mjs --results=bench-results.json --baseline=bench/baseline.json --enforce
      - uses: actions/upload-artifact@v4
        with: { name: bench-results, path: bench-results.json, retention-days: 30 }

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # CodeQL uploads SARIF to the code-scanning API, which needs its own token scopes.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm audit --audit-level=high --prod
      # Code scanning is a paid GitHub Advanced Security feature on private repositories: without
      # it the API answers "Resource not accessible by integration". The dependency audit above
      # still gates every run; CodeQL turns itself on automatically once the repo is public (or
      # GHAS is enabled — then drop the `if:`).
      - uses: github/codeql-action/init@v3
        if: github.event.repository.visibility == 'public'
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
        if: github.event.repository.visibility == 'public'

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # sync, worker and runner images are added with their services (P8/P9).
      matrix: { app: [web, api] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: false
          load: true
          tags: ghcr.io/nexus/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nexus/${{ matrix.app }}:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  migrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: nexus_test, POSTGRES_USER: nexus }
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://nexus:test@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - run: pnpm db:migrate
      - run: node scripts/check-migration-safety.mjs
      # `migrate diff --exit-code` proves the migrations match schema.prisma (no drift).
      - run: pnpm --filter @nexus/db exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code

  ci-ok:
    if: always()
    needs:
      [
        lint,
        typecheck,
        unit,
        coverage-gate,
        build,
        e2e,
        visual,
        bench,
        audit,
        docker,
        migrate-check,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fail if any needed job did not succeed
        run: |
          echo '${{ toJSON(needs) }}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const n=JSON.parse(s);const bad=Object.entries(n).filter(([,v])=>v.result!=='success');if(bad.length){console.error('failed:',bad.map(([k])=>k).join(', '));process.exit(1)}console.log('all jobs green')})"
