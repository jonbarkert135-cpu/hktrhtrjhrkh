# NEXUS self-host reference stack (19_DEPLOYMENT.md §3).
# P1 scope: postgres, redis, minio, api, web, caddy, egress-proxy.
# sync / worker / runner / otel-collector arrive with P8 / P9 and are added to this file then.
name: nexus

x-node-env: &node-env
  NODE_ENV: production
  NEXUS_ENV: production
  DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: nexus
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: 'true'
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_TRUSTED_ORIGINS: ${PUBLIC_APP_URL}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  SYNC_URL: ${SYNC_URL:-http://sync:3002}
  SYNC_SHARED_SECRET: ${SYNC_SHARED_SECRET}
  RUNNER_URL: ${RUNNER_URL:-http://runner:3003}
  RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET}
  EGRESS_PROXY_URL: http://egress-proxy:3128
  EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-api.github.com,raw.githubusercontent.com,objects.githubusercontent.com}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nexus
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
      - -c
      - wal_level=replica
      - -c
      - max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexus']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [core]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '1gb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [core]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [core]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: ghcr.io/nexus/api:${NEXUS_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *node-env
      OTEL_SERVICE_NAME: nexus-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    networks: [core, edge]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    image: ghcr.io/nexus/web:${NEXUS_VERSION:-dev}
    restart: unless-stopped
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    networks: [edge]

  egress-proxy:
    image: envoyproxy/envoy:v1.31-latest
    restart: unless-stopped
    command: ['-c', '/etc/envoy/envoy.yaml']
    volumes:
      - ./egress/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks: [core, egress]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web, api]
    networks: [edge]

networks:
  edge: {}
  core: { internal: true }
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  caddydata: {}
  caddyconfig: {}
