# Allowlist-only egress proxy (15_SECURITY.md §5.2, 19_DEPLOYMENT.md §3).
# Deny-by-default: a request whose :authority is not in `virtual_hosts[0].domains` gets 403.
# P1 skeleton — the allowlist is static here. Per-policy allowlists (`runner:<integrationId>`,
# `worker-unfurl`) and proxy auth arrive with the runner in P9; until then no service in the
# compose stack has an outbound code path, so this is enforcement scaffolding, not dead config.
# ponytail: static list instead of templating EGRESS_ALLOWLIST into this file — ceiling is
# "one allowlist for the whole host"; upgrade path is generating this file from env in P9.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: egress_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 3128 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress
                # Access log line per request: audit pipeline consumes these as `egress` events.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: '%START_TIME%'
                          method: '%REQ(:METHOD)%'
                          host: '%REQ(:AUTHORITY)%'
                          status: '%RESPONSE_CODE%'
                          bytes: '%BYTES_SENT%'
                          ms: '%DURATION%'
                          verdict: '%RESPONSE_FLAGS%'
                route_config:
                  name: allowlist
                  virtual_hosts:
                    - name: allowed
                      domains:
                        - 'api.github.com'
                        - 'api.github.com:443'
                        - 'github.com'
                        - 'github.com:443'
                        - 'codeload.github.com'
                        - 'codeload.github.com:443'
                        - 'raw.githubusercontent.com'
                        - 'raw.githubusercontent.com:443'
                        - 'objects.githubusercontent.com'
                        - 'objects.githubusercontent.com:443'
                      routes:
                        - match: { prefix: '/' }
                          route:
                            cluster: dynamic_forward_proxy
                            timeout: 30s
                    - name: denied
                      domains: ['*']
                      routes:
                        - match: { prefix: '/' }
                          direct_response:
                            status: 403
                            body: { inline_string: 'egress blocked: host not in allowlist' }
                http_filters:
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: egress_dns
                        dns_lookup_family: V4_ONLY
                        dns_refresh_rate: 60s
                        host_ttl: 300s
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: dynamic_forward_proxy
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: egress_dns
            dns_lookup_family: V4_ONLY
            dns_refresh_rate: 60s
            host_ttl: 300s
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
